<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện viết Hán tự bằng bút lông</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4efe6; --card:#fffdf8; --text:#2a2622; --muted:#7a7168; --line:#e2d9c8;
  --accent:#b8322a; --ok:#2f7d4f; --warn:#b7791f; --paper:#fbf6ea; --ink:#16130f; --guide:#d9b8b0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --card:#25211d; --text:#efe8dc; --muted:#a39a8d; --line:#3b352e;
    --accent:#e0594f; --ok:#5fbf86; --warn:#e0b04f;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --card:#25211d; --text:#efe8dc; --muted:#a39a8d; --line:#3b352e;
  --accent:#e0594f; --ok:#5fbf86; --warn:#e0b04f;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:16px 12px 40px}
.app{max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
h1{font-size:18px;margin:0;letter-spacing:.2px}
h1 span{color:var(--accent)}
.stats{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.stats b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.opts{display:flex;gap:10px;margin-bottom:12px}
.opt{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.opt select{width:100%;padding:10px 12px;font-size:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}
.prompt{text-align:center;padding:4px 0 12px}
.emoji{font-size:76px;line-height:1.1}
.word{font-size:30px;font-weight:700;margin-top:2px}
.sub{font-size:13px;color:var(--muted);margin-top:2px;min-height:18px}
.sub:empty{display:none}
.pad{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto;background:var(--paper);border:2px solid var(--accent);border-radius:8px;overflow:hidden;touch-action:none}
.pad > svg,.pad canvas,.pad .ref{position:absolute;inset:0;width:100%;height:100%}
.pad canvas{touch-action:none;cursor:crosshair}
.ref{display:flex;align-items:center;justify-content:center;font-family:"LXGW WenKai TC","Kaiti SC","KaiTi","STKaiti","Noto Sans SC",serif;font-weight:400;color:#b8322a;opacity:0;pointer-events:none;transition:opacity .2s;font-size:min(72vw,340px);line-height:1}
.ref.hint{opacity:.14}
.ref.reveal{opacity:.5}
.status{margin:12px 0 4px;min-height:56px;text-align:center}
.status .t{font-weight:700;font-size:16px}
.status .t .py{font-size:15px;font-weight:600;margin-left:4px}
.status .d{font-size:13px;color:var(--muted);margin-top:3px}
.ok .t{color:var(--ok)} .near .t{color:var(--warn)} .bad .t{color:var(--accent)}
.cands{display:flex;justify-content:center;gap:8px;margin-top:6px}
.cand{border:1px solid var(--line);border-radius:10px;padding:2px 10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cand b{font-size:22px;color:var(--text);font-family:"LXGW WenKai TC","Kaiti SC","KaiTi","STKaiti","Noto Sans SC",serif;font-weight:400}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btns button{padding:11px 6px;font-size:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.btns button:active{transform:scale(.97)}
.speak{position:absolute;right:8px;bottom:8px;z-index:3;width:31px;height:31px;border-radius:50%;border:1px solid var(--guide);background:rgba(255,255,255,.85);color:#333;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.speak:active{transform:scale(.97)}
.btns #dice{grid-column:1/-1;font-size:15px}
.btns #dice.next{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Heiti SC",sans-serif;font-weight:500}
.han{font-family:"LXGW WenKai TC","Kaiti SC","KaiTi","STKaiti","Noto Sans SC",serif;font-weight:400}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}
.loading{opacity:.5;pointer-events:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
</head>
<body>
<div class="app">
  <header>
    <h1 id="ttl">🖌️ Luyện viết <span>Hán tự</span></h1>
  </header>

  <div class="card" id="card">
    <div class="opts">
      <label class="opt"><span id="lvLabel">Trình độ</span>
        <select id="lv">
          <option value="1">HSK 1</option><option value="2">HSK 2</option><option value="3">HSK 3</option>
          <option value="4">HSK 4</option><option value="5">HSK 5</option><option value="6">HSK 6</option>
        </select>
      </label>
      <label class="opt"><span id="lgLabel">Ngôn ngữ</span>
        <select id="lg">
          <option value="vi">Tiếng Việt</option><option value="en">English</option>
        </select>
      </label>
    </div>

    <div class="prompt">
      <div class="emoji" id="emoji"></div>
      <div class="word" id="word"></div>
      <div class="sub" id="sub"></div>
    </div>

    <div class="pad" id="pad">
      <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <g stroke="var(--guide)" stroke-width=".5" stroke-dasharray="2 2" fill="none">
          <line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/>
          <line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/>
        </g>
      </svg>
      <div class="ref" id="ref" lang="zh-Hans"></div>
      <canvas id="cv"></canvas>
      <button class="speak" id="speak" type="button" aria-label="Nghe phát âm">🔊</button>
    </div>

    <div class="status" id="status"></div>

    <div class="btns">
      <button id="undo">↶ Hoàn tác nét</button>
      <button id="clear">🗑 Xóa hết</button>
      <button id="reveal">👁 Xem đáp án</button>
      <button id="dice">🎲 Từ khác</button>
    </div>
  </div>

</div>

function zhVoice(){
  if(!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices() || [];
  return vs.find(v=>/^zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
function speak(text, quiet){
  const fail = ()=>{ if(!quiet) setStatus("bad", tr("nospeech1"), tr("nospeech2")); };
  if(!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined"){ fail(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = 0.8;
    const v = zhVoice(); if(v) u.voice = v;
    u.onerror = ()=>{ if(!zhVoice()) fail(); };
    speechSynthesis.speak(u);
  }catch(e){ fail(); }
}

/* ---------- Mẫu chữ & khoảng cách ---------- */
function distTransform(mask){
  const d = new Float32Array(G*G);
  for(let i=0;i<G*G;i++) d[i] = mask[i] ? 0 : 1e3;
  const at = (x,y)=> (x<0||y<0||x>=G||y>=G) ? 1e3 : d[y*G+x];
  for(let y=0;y<G;y++) for(let x=0;x<G;x++){
    const i=y*G+x; let v=d[i];
    v=Math.min(v, at(x-1,y)+1, at(x,y-1)+1, at(x-1,y-1)+1.414, at(x+1,y-1)+1.414); d[i]=v;
  }
  for(let y=G-1;y>=0;y--) for(let x=G-1;x>=0;x--){
    const i=y*G+x; let v=d[i];
    v=Math.min(v, at(x+1,y)+1, at(x,y+1)+1, at(x+1,y+1)+1.414, at(x-1,y+1)+1.414); d[i]=v;
  }
  return d;
}
function maskPoints(mask){ const p=[]; for(let i=0;i<G*G;i++) if(mask[i]) p.push(i%G, (i/G)|0); return p; }

// Dữ liệu nét chữ (kiểu chữ của Hanzi Writer / Make Me a Hanzi), tải từ CDN; nếu không tải được thì dùng phông chữ
const STROKES = {}, RADS = {};
const DATA_URLS = ["https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/", "https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.0/"];
async function fetchChar(ch){
  if(window.HanziWriter && HanziWriter.loadCharacterData){
    try{ const d = await HanziWriter.loadCharacterData(ch); if(d && Array.isArray(d.strokes) && d.strokes.length) return d; }catch(e){}
  }
  for(const base of DATA_URLS){
    try{
      const r = await fetch(base + encodeURIComponent(ch) + ".json");
      if(!r.ok) continue;
      const d = await r.json();
      if(d && Array.isArray(d.strokes) && d.strokes.length) return d;
    }catch(e){}
  }
  return null;
}
let bigC, bigX, smallC, smallX;
function makeTemplate(ch){
  if(!bigC){
    bigC = document.createElement("canvas"); bigC.width = bigC.height = 200; bigC.lang = "zh-Hans";
    bigX = bigC.getContext("2d", {willReadFrequently:true});
    smallC = document.createElement("canvas"); smallC.width = smallC.height = G;
    smallX = smallC.getContext("2d", {willReadFrequently:true});
  }
  const bc = bigX, sc = smallX;
  bc.setTransform(1,0,0,1,0,0); bc.clearRect(0,0,200,200);
  bc.fillStyle="#000";
  if(STROKES[ch]){
    const k = 200/1024;
    bc.setTransform(k,0,0,-k,0,900*k);
    STROKES[ch].forEach(d=>bc.fill(new Path2D(d)));
    bc.setTransform(1,0,0,1,0,0);
  } else {
    bc.strokeStyle="#000"; bc.lineWidth=6; bc.lineJoin="round";
    bc.font = `400 160px ${FONT}`; bc.textAlign="center"; bc.textBaseline="middle";
    bc.strokeText(ch,100,104); bc.fillText(ch,100,104);
  }
  const d = bc.getImageData(0,0,200,200).data;
  let x0=200,y0=200,x1=-1,y1=-1;
  for(let y=0;y<200;y++) for(let x=0;x<200;x++) if(d[(y*200+x)*4+3]>128){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  sc.clearRect(0,0,G,G);
  if(x1>=0){
    const bw=x1-x0+1, bh=y1-y0+1, s=FIT/Math.max(bw,bh);
    sc.drawImage(bigC, x0,y0,bw,bh, (G-bw*s)/2,(G-bh*s)/2, bw*s,bh*s);
  }
  const id = sc.getImageData(0,0,G,G).data, mask = new Uint8Array(G*G);
  for(let i=0;i<G*G;i++) mask[i] = id[i*4+3]>110 ? 1 : 0;
  return {ch:ch, pts:maskPoints(mask), dt:distTransform(mask)};
}
const TPL = {};
function buildTemplates(){ CHARSET.forEach(c=>{ TPL[c] = makeTemplate(c); }); }
let refs = [];
let curN = 1;
function boxS(){ return Math.max(30, Math.floor(Math.min(pad.clientWidth, pad.clientHeight) / curN)); }
function refPad(){ return Math.round(boxS()*0.1); }
// Căn chữ vào chính giữa mỗi ô: đo khung bao thật của các nét rồi dịch cả khối chữ
function centerRef(i){
  const o = refs[i]; if(!o || !o.center) return;
  const k = (boxS() - 2*refPad())/1024;
  const dx = (512 - o.center.cx)*k, dy = (o.center.cy - 388)*k;
  o.box.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
}
function measureCenter(data){
  try{
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns,"svg");
    svg.setAttribute("width","10"); svg.setAttribute("height","10");
    svg.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden";
    const g = document.createElementNS(ns,"g");
    data.strokes.forEach(d=>{ const p = document.createElementNS(ns,"path"); p.setAttribute("d", d); g.appendChild(p); });
    svg.appendChild(g); document.body.appendChild(svg);
    const b = g.getBBox(); document.body.removeChild(svg);
    if(b.width>0 && b.height>0) return {cx:b.x+b.width/2, cy:b.y+b.height/2};
  }catch(e){}
  return null;
}
function setRef(){
  const w = WORDS[idx], r = $("ref"); curN = [...w.s].length; const S = boxS();
  r.innerHTML = ""; refs = [];
  [...w.s].forEach((ch,i)=>{
    const box = document.createElement("div");
    box.style.cssText = "width:"+S+"px;height:"+S+"px;flex:none;display:flex;align-items:center;justify-content:center;line-height:1;font-size:"+Math.round(S*0.72)+"px";
    r.appendChild(box);
    const o = {box:box, writer:null, center:null}; refs.push(o);
    const fallback = ()=>{ box.innerHTML = ""; box.style.transform = ""; box.textContent = ch; o.writer = null; o.center = null; };
    if(!window.HanziWriter){ fallback(); return; }
    try{
      o.writer = HanziWriter.create(box, ch, {
        width: S, height: S, padding: refPad(),
        showOutline: false, showCharacter: true,
        strokeColor: "#b8322a",
        onLoadCharDataSuccess: d=>{ o.center = measureCenter(d); centerRef(i); },
        onLoadCharDataError: fallback
      });
    }catch(e){ fallback(); }
  });
}
function resizeRefs(){
  const S = boxS();
  refs.forEach((o,i)=>{
    o.box.style.width = S+"px"; o.box.style.height = S+"px";
    if(o.writer){ try{ o.writer.updateDimensions({width:S, height:S, padding:refPad()}); centerRef(i); }catch(e){} }
    else o.box.style.fontSize = Math.round(S*0.72)+"px";
  });
}
function loadStrokeData(){
  CHARSET.forEach(ch=>{
    fetchChar(ch).then(d=>{
      if(!d) return;
      STROKES[ch] = d.strokes; RADS[ch] = d.radStrokes || [];
      TPL[ch] = makeTemplate(ch);
    });
  });
}

/* ---------- Nhận diện ---------- */
function userMask(list){
  let x0=1,y0=1,x1=0,y1=0;
  list.forEach(s=>s.forEach(p=>{ x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }));
  const dim = Math.max(x1-x0, y1-y0);
  if(dim < 0.14) return null;
  const s = FIT/dim, c = document.createElement("canvas"); c.width=c.height=G;
  const k = c.getContext("2d", {willReadFrequently:true});
  const ox = G/2 - (x0+x1)/2*s, oy = G/2 - (y0+y1)/2*s;
  k.strokeStyle="#000"; k.fillStyle="#000"; k.lineWidth=1.6; k.lineCap="round"; k.lineJoin="round";
  list.forEach(st=>{
    k.beginPath();
    st.forEach((p,i)=>{ const X=p.x*s+ox, Y=p.y*s+oy; i?k.lineTo(X,Y):k.moveTo(X,Y); });
    if(st.length===1){ k.lineTo(st[0].x*s+ox+.1, st[0].y*s+oy); }
    k.stroke();
  });
  const d = k.getImageData(0,0,G,G).data, mask=new Uint8Array(G*G);
  for(let i=0;i<G*G;i++) mask[i] = d[i*4+3]>60 ? 1:0;
  return mask;
}
function scoreAgainst(uPts, uDT, t){
  let best = 0;
  const n = uPts.length/2, m = t.pts.length/2;
  if(!n||!m) return 0;
  for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
    let a=0;
    for(let i=0;i<uPts.length;i+=2){
      const x=uPts[i]+dx, y=uPts[i+1]+dy;
      if(x>=0&&y>=0&&x<G&&y<G && t.dt[y*G+x]<=3.2) a++;
    }
    let b=0;
    for(let i=0;i<t.pts.length;i+=2){
      const x=t.pts[i]-dx, y=t.pts[i+1]-dy;
      if(x>=0&&y>=0&&x<G&&y<G && uDT[y*G+x]<=5) b++;
    }
    const prec=a/n, cov=b/m, f = (prec+cov) ? 2*prec*cov/(prec+cov) : 0;
    if(f>best) best=f;
  }
  return best;
}
function levelChars(){ const set = new Set(); pool().forEach(i=>[...WORDS[i].s].forEach(c=>set.add(c))); return [...set]; }
function strokeCell(st, n){ let m = 0; st.forEach(p=>{ m += p.x; }); m /= st.length; return Math.min(n-1, Math.max(0, Math.floor(m*n))); }
function recognize(){
  if(!ready || !strokes.length || solved) return;
  const w = WORDS[idx], chars = [...w.s], n = chars.length;
  const groups = chars.map(()=>[]);
  strokes.forEach(st=>groups[strokeCell(st,n)].push(st));
  if(groups.some(g=>!g.length)){ setStatus("near", tr("more"), ""); return; }
  const cand = levelChars(), results = [];
  for(let i=0;i<n;i++){
    const mask = userMask(groups[i]);
    if(!mask){ setStatus("bad", tr("small1"), tr("small2")); return; }
    const uPts = maskPoints(mask), uDT = distTransform(mask);
    const res = cand.map(c=>({ch:c, s:scoreAgainst(uPts,uDT,TPL[c])})).sort((a,b)=>b.s-a.s);
    const rank = res.findIndex(r=>r.ch===chars[i]);
    results.push({rank:rank, ts:res[rank].s, top:res[0].ch});
  }
  const k = results.findIndex(r=>!(r.rank===0 && r.ts>=0.55));
  if(k<0){
    solved = true; if(!revealedThisWord){ stats.sc++; stats.tot++; stats.stk++; } updateStats();
    setStatus("ok", tr("ok")+" "+title(w), info(w));
    updateDice(); speak(w.s, true);
  } else {
    const r = results[k];
    if(r.rank<=2 && r.ts>=0.38) setStatus("near", tr("near1"), n>1 ? tr("cellnear").replace("{k}",k+1) : tr("near2"));
    else setStatus("bad", tr("bad1"), (n>1 ? tr("cellbad").replace("{k}",k+1) : tr("bad2a")) + han(r.top) + tr("bad2b"));
  }
}

  $("status").innerHTML=`<div class="t">${t}</div><div class="d">${d}</div>${extra||""}`;
}
function updateStats(){}

/* ---------- Bút lông ---------- */
const WMAX = 0.042;
function resize(){
  const r = pad.getBoundingClientRect(); dpr = window.devicePixelRatio||1; W = r.height;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  resizeRefs(); redraw();
}
function stamp(a,b){
  const ax=a.x*W, ay=a.y*W, bx=b.x*W, by=b.y*W, d=Math.hypot(bx-ax,by-ay);
  const n = Math.max(1, Math.ceil(d/1.2));
  for(let i=0;i<=n;i++){
    const t=i/n, x=ax+(bx-ax)*t, y=ay+(by-ay)*t, r=(a.w+(b.w-a.w)*t)*W/2;
    ctx.beginPath(); ctx.arc(x,y,Math.max(r,.6),0,Math.PI*2); ctx.fill();
  }
}
function redraw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width/dpr+2,W+2);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#16130f";
  strokes.forEach(s=>{ if(s.length===1) stamp(s[0],s[0]); for(let i=1;i<s.length;i++) stamp(s[i-1],s[i]); });
}
function pos(e){ const r=pad.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.height, y:(e.clientY-r.top)/r.height, t:e.timeStamp, pr:e.pressure}; }

cv.addEventListener("pointerdown", e=>{
  if(!ready) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  clearTimeout(timer);
  const p = pos(e);
  cur = [{x:p.x,y:p.y,w:WMAX*.55}]; cur._last = p; strokes.push(cur);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#16130f";
  stamp(cur[0],cur[0]);
});
cv.addEventListener("pointermove", e=>{
  if(!cur) return; e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  (evs.length?evs:[e]).forEach(ev=>{
    const raw = pos(ev), prev = cur[cur.length-1], last = cur._last;
    const x = prev.x+(raw.x-prev.x)*.55, y = prev.y+(raw.y-prev.y)*.55;
    const dist = Math.hypot(x-prev.x,y-prev.y)*W; if(dist<1.2) return;
    const dt = Math.max(1, raw.t-last.t), v = dist/dt;
    let target = WMAX*(1-.62*Math.min(1,v/2.6));
    if(ev.pointerType==="pen" && raw.pr>0) target = WMAX*(.35+.65*raw.pr);
    const w = prev.w*.7 + target*.3;
    const np = {x,y,w}; cur.push(np); cur._last = raw;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#16130f"; stamp(prev,np);
  });
});
function endStroke(e){
  if(!cur) return; cur=null;
  clearTimeout(timer); timer = setTimeout(recognize, 1100);
}
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);

/* ---------- Điều khiển ---------- */
function pool(){ const r=[]; WORDS.forEach((w,i)=>{ if(w.lv===level) r.push(i); }); return r; }
function clearPad(){ strokes=[]; cur=null; redraw(); }
$("undo").onclick = ()=>{ strokes.pop(); redraw(); clearTimeout(timer); if(strokes.length) timer=setTimeout(recognize,1100); };
$("clear").onclick = ()=>{ clearPad(); clearTimeout(timer); if(!solved) setStatus("","",tr("cleared")); };
$("reveal").onclick = ()=>{
  const r = $("ref");
  if(r.classList.contains("reveal")){
    r.className = "ref";
    if(!solved) setStatus("","","");
    return;
  }
  const w = WORDS[idx]; r.className = "ref reveal";
  if(!solved && !revealedThisWord){ stats.tot++; stats.stk=0; updateStats(); }
  revealedThisWord = true;
  setStatus("near", title(w), info(w));
};
function syncOpts(){ $("lv").value = String(level); $("lg").value = lang; }
$("speak").onclick = ()=>{ if(idx!==null) speak(WORDS[idx].s); };
$("dice").onclick = ()=>{ if(ready) nextWord(); };
$("lv").addEventListener("change", ()=>{
  level=+$("lv").value; savePrefs(); deck=[]; idx=null; if(ready) nextWord();
});
$("lg").addEventListener("change", ()=>{
  lang=$("lg").value; savePrefs(); applyLang(); if(!solved) setStatus("","",""); showPrompt();
});

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
let firstLoad = true;
function forcedIdx(){
  let c = ""; try{ c = new URLSearchParams(location.search).get("w") || decodeURIComponent(location.hash.slice(1)); }catch(e){}
  return c ? WORDS.findIndex(w=>w.t===c || w.s===c) : -1;
}
function nextWord(){
  let fi = -1;
  if(firstLoad){ firstLoad = false; fi = forcedIdx(); if(fi>=0){ level = WORDS[fi].lv; syncOpts(); deck = []; } }
  if(fi<0 && !deck.length){ deck = shuffle(pool().filter(i=>i!==idx)); if(!deck.length) deck = pool(); }
  idx = fi>=0 ? fi : deck.pop(); solved=false; revealedThisWord=false; clearTimeout(timer); clearTimeout(autoTimer); updateDice();
  curN = [...WORDS[idx].s].length;
  clearPad();
  const rf = $("ref");
  rf.style.transition = "none"; rf.className = "ref"; void rf.offsetWidth;   // ẩn ngay lập tức, không mờ dần
  setRef();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ rf.style.transition = ""; }));
  setStatus("","","");
  showPrompt();
}
function showPrompt(){
  if(idx===null) return; const w = WORDS[idx];
  $("emoji").textContent = w.em;
  $("word").textContent  = lang==="en" ? w.en : w.vi;
  $("sub").textContent   = "";
}
window.addEventListener("resize", resize);
syncOpts(); applyLang(); resize(); updateStats();
</script>
